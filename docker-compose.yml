version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: edusphere-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Your_Secure_Password_123!
    ports:
      - "1433:1433"
    networks:
      - edusphere-network

  identity-api:
    build:
      context: ./backend
      dockerfile: IdentityService/Dockerfile
    container_name: edusphere-identity
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=IdentityDb;User Id=sa;Password=Your_Secure_Password_123!;TrustServerCertificate=True;
    ports:
      - "5001:8080"
    depends_on:
      - sqlserver
    networks:
      - edusphere-network

  course-api:
    build:
      context: ./backend
      dockerfile: CourseService/Dockerfile
    container_name: edusphere-course
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=CourseDb;User Id=sa;Password=Your_Secure_Password_123!;TrustServerCertificate=True;
    ports:
      - "5002:8080"
    depends_on:
      - sqlserver
    networks:
      - edusphere-network

  core-api:
    build:
      context: ./backend
      dockerfile: EduSphere.Core/Dockerfile
    container_name: edusphere-core
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=CoreDb;User Id=sa;Password=Your_Secure_Password_123!;TrustServerCertificate=True;
    ports:
      - "5003:8080"
    depends_on:
      - sqlserver
    networks:
      - edusphere-network

  api-gateway:
    build:
      context: ./backend
      dockerfile: ApiGateway/Dockerfile
    container_name: edusphere-gateway
    ports:
      - "5000:8080"
    networks:
      - edusphere-network

networks:
  edusphere-network:
    driver: bridge
